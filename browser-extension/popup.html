<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, sans-serif; width: 260px; margin: 0; padding: 14px; color: #222; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      button { width: 100%; padding: 8px; cursor: pointer; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      .row button { width: auto; flex: 1; }
      #status { margin-top: 10px; font-size: 12px; color: #555; white-space: pre-wrap; }
      a { font-size: 11px; color: #777; }
    </style>
  </head>
  <body>
    <h1>Session Sync</h1>
    <button id="sync">Sync now</button>
    <div class="row">
      <button id="stop">Stop auto-sync</button>
      <button id="start">Start auto-sync</button>
    </div>
    <div id="status">Checking last sync…</div>
    <div id="nextSync" style="margin-top: 6px; color: #888;"></div>
    <p><a href="#" id="openOptions">Setup / change app URL</a></p>
    <script src="popup.js"></script>
  </body>
</html>
