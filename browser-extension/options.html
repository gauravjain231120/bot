<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Order Alert Session Sync — Setup</title>
    <style>
      body { font: 14px -apple-system, sans-serif; max-width: 420px; margin: 24px; color: #222; }
      h1 { font-size: 16px; }
      label { display: block; margin-top: 14px; font-size: 12px; color: #555; }
      input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: 13px monospace; }
      button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
      #status { margin-top: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Order Alert Session Sync — Setup</h1>
    <p>Enter your order-alert app's URL and the sync secret (the <code>EXTENSION_SYNC_SECRET</code> environment variable set on that app). This will sync both Myntra and Amazon Seller Central sessions, reading whichever you're logged into in this browser.</p>

    <label>App URL
      <input id="appUrl" placeholder="https://your-app.vercel.app" />
    </label>
    <label>Sync secret
      <input id="syncSecret" type="password" placeholder="the EXTENSION_SYNC_SECRET value" />
    </label>

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
